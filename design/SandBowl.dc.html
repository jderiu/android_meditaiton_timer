  <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px;">

</x-dc>
<script data-dc-script data-props='{"duration":{"editor":"int","default":10,"min":1,"max":60,"unit":"min","section":"Session"},"progress":{"editor":"range","default":0.4,"min":0,"max":1,"step":0.01,"section":"Session"},"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  gong(isEnd) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { return; }
      if (!this._ctx) { this._ctx = new AC(); }
      const ctx = this._ctx;
      if (ctx.state === 'suspended') { ctx.resume(); }
      const t0 = ctx.currentTime + 0.02;
      const master = ctx.createGain();
      master.gain.value = isEnd ? 0.45 : 0.4;
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 2400;
      master.connect(lp);
      lp.connect(ctx.destination);
      const parts = isEnd
        ? [[98, 0.32, 14], [196, 0.5, 13], [393, 0.16, 9], [584, 0.08, 6], [823, 0.04, 4]]
        : [[196, 0.5, 8], [393, 0.18, 6], [584, 0.09, 4.5], [823, 0.05, 3]];
      const atk = isEnd ? 0.07 : 0.05;
      for (const pr of parts) {
        for (const dt of [1, 1.0021]) {
          const o = ctx.createOscillator();
          o.type = 'sine';
          o.frequency.value = pr[0] * dt;
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, t0);
          g.gain.linearRampToValueAtTime(pr[1] * 0.5, t0 + atk);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + pr[2]);
          o.connect(g);
          g.connect(master);
          o.start(t0);
          o.stop(t0 + pr[2] + 0.1);
        }
      }
    } catch (e) {}
  }
  renderVals() {
    const D = this.props.duration ?? 10;
    const p = Math.min(1, Math.max(0, this.props.progress ?? 0.4));
    const topEmpty = 384;
    const topFull = 262;
    const ST = +(topEmpty - p * (topEmpty - topFull)).toFixed(2);
    const mh = 16 * Math.min(1, p * 8) * Math.min(1, (1 - p) * 10);
    const apex = +(ST - mh).toFixed(2);
    const sh = +(ST - mh * 0.45).toFixed(2);
    const edge = +(ST + 0.375 * mh).toFixed(2);
    const mid = +(ST + 0.26 * mh).toFixed(2);
    const sandTopPath = 'M40 ' + edge + ' C100 ' + mid + ', 140 ' + sh + ', 180 ' + apex +
                        ' C220 ' + sh + ', 260 ' + mid + ', 320 ' + edge;
    const sandPath = sandTopPath + ' L320 440 L40 440 Z';
    return {
      durationLabel: D + (D === 1 ? ' minute' : ' minutes'),
      sandPath: sandPath,
      sandTopPath: sandTopPath,
      streamTipY: +(apex + 2).toFixed(2),
      impactT: 'translate(0 ' + apex + ')',
      streamOpacity: (p > 0.001 && p < 0.999) ? 0.9 : 0,
      playGong: () => {
        const isEnd = !!(this.state && this.state.nextEnd);
        this.gong(isEnd);
        this.setState({ nextEnd: !isEnd });
      }
    };
  }
}
</script>
