      <text x="170" y="{{koanY2}}" text-anchor="middle" font-family="'Cormorant Garamond', 'Palatino Linotype', Georgia, serif" font-size="14.5" font-style="italic" font-weight="600" fill="rgba(70,41,15,0.88)" letter-spacing="0.6">{{koanL2}}</text>
      <text x="170" y="{{koanY3L}}" text-anchor="middle" font-family="'Cormorant Garamond', 'Palatino Linotype', Georgia, serif" font-size="14.5" font-style="italic" font-weight="600" fill="rgba(247,221,171,0.55)" letter-spacing="0.6">{{koanL3}}</text>

  <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px;">
    <div role="button" style="width: 66px; height: 66px; border-radius: 50%; border: 1px solid rgba(201,163,106,0.55); background: radial-gradient(circle at 50% 36%, rgba(201,163,106,0.16), rgba(201,163,106,0.04)); display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="18" height="22" viewBox="0 0 18 22"><rect x="2" y="1" width="4.6" height="20" rx="2.3" fill="#e6d4ac"></rect><rect x="11.4" y="1" width="4.6" height="20" rx="2.3" fill="#e6d4ac"></rect></svg>
    </div>
    <div role="button" style="height: 44px; display: flex; align-items: center; padding: 0 14px; font-size: 12px; letter-spacing: 3.5px; text-transform: uppercase; color: rgba(236,224,203,0.68); cursor: pointer;">end session</div>

  <div style="height: 30px;"></div>
</div>
</x-dc>
<script data-dc-script data-props='{"duration":{"editor":"int","default":10,"min":1,"max":60,"unit":"min","section":"Session"},"progress":{"editor":"range","default":0.4,"min":0,"max":1,"step":0.01,"section":"Session"},"koan":{"editor":"text","default":"The gong fades. Where does the sound go?","section":"Koan"},"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  gong(isEnd) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { return; }
      if (!this._ctx) { this._ctx = new AC(); }
      const ctx = this._ctx;
      if (ctx.state === 'suspended') { ctx.resume(); }
      const t0 = ctx.currentTime + 0.02;
      const master = ctx.createGain();
      master.gain.value = isEnd ? 0.45 : 0.4;
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 2400;
      master.connect(lp);
      lp.connect(ctx.destination);
      const parts = isEnd
        ? [[98, 0.32, 14], [196, 0.5, 13], [393, 0.16, 9], [584, 0.08, 6], [823, 0.04, 4]]
        : [[196, 0.5, 8], [393, 0.18, 6], [584, 0.09, 4.5], [823, 0.05, 3]];
      const atk = isEnd ? 0.07 : 0.05;
      for (const pr of parts) {
        for (const dt of [1, 1.0021]) {
          const o = ctx.createOscillator();
          o.type = 'sine';
          o.frequency.value = pr[0] * dt;
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, t0);
          g.gain.linearRampToValueAtTime(pr[1] * 0.5, t0 + atk);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + pr[2]);
          o.connect(g);
          g.connect(master);
          o.start(t0);
          o.stop(t0 + pr[2] + 0.1);
        }
      }
    } catch (e) {}
  }
  renderVals() {
    const D = this.props.duration ?? 10;
    const p = Math.min(1, Math.max(0, this.props.progress ?? 0.4));
    const wrap = (text, max) => {
      const words = String(text).trim().split(/\s+/).filter(Boolean);
      const lines = [];
      let cur = '';
      for (const w of words) {
        const t = cur ? cur + ' ' + w : w;
        if (t.length <= max) { cur = t; } else { if (cur) { lines.push(cur); } cur = w; }
      }
      if (cur) { lines.push(cur); }
      return lines.slice(0, 3);
    };
    const kl = wrap(this.props.koan ?? '', 26);
    const lh = 17;
    const ky = 233 - (kl.length - 1) * lh / 2;
    const tick = (r1, r2, i) => {
      const a = i * 6 * Math.PI / 180;
      const sx = Math.sin(a);
      const cy = Math.cos(a);
      return 'M' + (170 + r1 * sx).toFixed(2) + ' ' + (170 - r1 * cy).toFixed(2) +
             ' L' + (170 + r2 * sx).toFixed(2) + ' ' + (170 - r2 * cy).toFixed(2) + ' ';
    };
    let minor = '';
    let major = '';
    for (let i = 0; i < 60; i++) {
      if (i % 15 === 0) { major += tick(126, 112, i); } else { minor += tick(126, 118, i); }
    }
    return {
      durationLabel: D + (D === 1 ? ' minute' : ' minutes'),
      koanL1: kl[0] || '',
      koanL2: kl[1] || '',
      koanL3: kl[2] || '',
      koanY1: ky,
      koanY1L: ky + 0.8,
      koanY2: ky + lh,
      koanY2L: ky + lh + 0.8,
      koanY3: ky + 2 * lh,
      koanY3L: ky + 2 * lh + 0.8,
      needleRot: 'rotate(' + (p * 360).toFixed(2) + ' 170 170)',
      ticksMinor: minor,
      ticksMajor: major,
      playGong: () => {
        const isEnd = !!(this.state && this.state.nextEnd);
        this.gong(isEnd);
        this.setState({ nextEnd: !isEnd });
      }
    };
  }
}
</script>
</body>
